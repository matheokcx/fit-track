<div class="workoutsList">
    <h3 style="font-weight: bold;">Derniers entrainements</h3>
    <ion-list>
        @for (workout of lastWorkouts; track workout) {
            <app-workout-item [workout]="workout"></app-workout-item>
        }
    </ion-list>
    <ion-button (click)="openWorkoutAddModal()" style="width: 100%">
        <ion-icon name="add"></ion-icon>
    </ion-button>
</div>
